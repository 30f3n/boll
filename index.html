<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدربي | التشكيلة المباشرة ولوحة الإدارة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #090e17;
            color: #f8fafc;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-950 text-slate-100">
    <header class="bg-slate-900 border-b border-slate-800 px-4 py-3">
        <div class="max-w-5xl mx-auto flex items-center justify-between gap-3">
            <div class="flex items-center gap-2.5">
                <i data-lucide="trophy" class="w-6 h-6 text-amber-400"></i>
                <h1 class="text-xl font-black text-white">مُدَرِّبِي</h1>
                <span id="authStatusBadge" class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                    وضع اللاعبين
                </span>
            </div>
            <div id="guestControls">
                <button onclick="openAdminLogin()" class="px-3.5 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-black transition">
                    دخول الإدارة
                </button>
            </div>
            <div id="adminControls" class="hidden items-center gap-2">
                <button onclick="logoutAdmin()" class="px-3.5 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-xs font-black transition">
                    تسجيل خروج
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-8 space-y-6">
        <section id="noMatchBox" class="bg-slate-900 border border-slate-800 rounded-2xl p-8 text-center">
            <i data-lucide="calendar-x-2" class="w-10 h-10 text-amber-400 mx-auto mb-3"></i>
            <h2 class="text-xl font-black text-white mb-1">لا توجد مباراة حالياً</h2>
            <p class="text-xs text-slate-400">سيتم عرض التشكيلة والموعد فور تفعيل مباراة من قِبل الإدارة.</p>
        </section>

        <section id="matchBox" class="hidden bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-800 pb-3">
                <h2 class="text-lg font-black text-white">تفاصيل المباراة المباشرة</h2>
                <span id="matchSchedule" class="text-xs font-bold text-amber-400"></span>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-sm">
                <div class="bg-slate-950 border border-slate-800 rounded-xl p-3">
                    <span class="text-xs text-slate-400 block">الملعب</span>
                    <strong id="matchVenue" class="text-white">-</strong>
                </div>
                <div class="bg-slate-950 border border-slate-800 rounded-xl p-3">
                    <span class="text-xs text-slate-400 block">الحكم</span>
                    <strong id="matchReferee" class="text-white">-</strong>
                </div>
                <div class="bg-slate-950 border border-slate-800 rounded-xl p-3">
                    <span class="text-xs text-slate-400 block">سعر الحجز الكلي</span>
                    <strong id="matchPrice" class="text-emerald-400">-</strong>
                </div>
            </div>

            <div id="adminEditorBox" class="hidden pt-4 border-t border-slate-800 space-y-3">
                <h3 class="text-sm font-black text-amber-300">تعديل بيانات المباراة (محمي بحساب الإدارة)</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
                    <input id="inpVenue" type="text" placeholder="اسم الملعب" class="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                    <input id="inpReferee" type="text" placeholder="اسم الحكم" class="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                    <input id="inpDate" type="date" class="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                    <input id="inpTime" type="time" class="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                </div>
                <div class="flex flex-wrap items-center gap-3">
                    <label class="flex items-center gap-2 text-xs font-bold text-slate-300">
                        <input id="inpActive" type="checkbox" class="w-4 h-4 accent-emerald-500">
                        <span>تفعيل المباراة للاعبين</span>
                    </label>
                    <button onclick="saveMatchAdmin()" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-black">
                        حفظ ومزامنة
                    </button>
                </div>
            </div>
        </section>
    </main>

    <!-- نافذة دخول الإدارة بالبريد والباسورد -->
    <div id="loginModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/80 p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-sm p-6 space-y-4">
            <h3 class="text-base font-black text-white">تسجيل دخول الإدارة</h3>
            <form onsubmit="submitAdminLogin(event)" class="space-y-3">
                <input id="loginEmail" type="email" required placeholder="البريد الإلكتروني للإدارة"
                    class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white outline-none">
                <input id="loginPassword" type="password" required placeholder="كلمة المرور"
                    class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white outline-none">
                <p id="loginErr" class="hidden text-xs text-rose-400 font-bold">بيانات الدخول غير صحيحة</p>
                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="closeAdminLogin()" class="flex-1 py-2 rounded-xl bg-slate-800 text-xs font-bold">إلغاء</button>
                    <button type="submit" class="flex-1 py-2 rounded-xl bg-amber-500 text-slate-950 text-xs font-black">دخول</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-analytics.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { firebaseConfig, appId } from "./firebase-config.js";

        const app = initializeApp(firebaseConfig);
        try {
            getAnalytics(app);
        } catch (_) {}

        const auth = getAuth(app);
        const db = getFirestore(app);
        const matchDocRef = doc(db, "artifacts", appId, "public", "data", "mudaribi_matches", "active_match");

        let isAdmin = false;
        let currentMatch = {
            hasActiveMatch: false,
            venue: "",
            referee: "",
            matchDate: "",
            matchClock: "",
            pitchPrice: 20000
        };

        onAuthStateChanged(auth, (user) => {
            isAdmin = Boolean(user);
            document.getElementById("guestControls").classList.toggle("hidden", isAdmin);
            document.getElementById("adminControls").classList.toggle("hidden", !isAdmin);
            document.getElementById("adminControls").classList.toggle("flex", isAdmin);
            document.getElementById("adminEditorBox").classList.toggle("hidden", !isAdmin);
            document.getElementById("authStatusBadge").textContent = isAdmin ? "وضع الإدارة الموثّق" : "وضع اللاعبين";
            renderMatchUI();
        });

        onSnapshot(matchDocRef, (snap) => {
            if (snap.exists()) {
                currentMatch = { ...currentMatch, ...snap.data() };
            }
            renderMatchUI();
        });

        function renderMatchUI() {
            const showMatch = Boolean(currentMatch.hasActiveMatch) || isAdmin;
            document.getElementById("noMatchBox").classList.toggle("hidden", showMatch);
            document.getElementById("matchBox").classList.toggle("hidden", !showMatch);

            document.getElementById("matchVenue").textContent = currentMatch.venue || "غير محدد";
            document.getElementById("matchReferee").textContent = currentMatch.referee || "غير محدد";
            document.getElementById("matchPrice").textContent = `${Number(currentMatch.pitchPrice || 0).toLocaleString("en-US")} د.ع`;

            const sched = [currentMatch.matchDate, currentMatch.matchClock].filter(Boolean).join(" • ");
            document.getElementById("matchSchedule").textContent = sched || "الموعد غير محدد";

            if (isAdmin) {
                document.getElementById("inpVenue").value = currentMatch.venue || "";
                document.getElementById("inpReferee").value = currentMatch.referee || "";
                document.getElementById("inpDate").value = currentMatch.matchDate || "";
                document.getElementById("inpTime").value = currentMatch.matchClock || "";
                document.getElementById("inpActive").checked = Boolean(currentMatch.hasActiveMatch);
            }
            lucide.createIcons();
        }

        window.openAdminLogin = () => {
            document.getElementById("loginErr").classList.add("hidden");
            const m = document.getElementById("loginModal");
            m.classList.remove("hidden");
            m.classList.add("flex");
        };

        window.closeAdminLogin = () => {
            const m = document.getElementById("loginModal");
            m.classList.add("hidden");
            m.classList.remove("flex");
        };

        window.submitAdminLogin = async (e) => {
            e.preventDefault();
            const email = document.getElementById("loginEmail").value.trim();
            const pass = document.getElementById("loginPassword").value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                closeAdminLogin();
            } catch (_) {
                document.getElementById("loginErr").classList.remove("hidden");
            }
        };

        window.logoutAdmin = async () => {
            await signOut(auth);
        };

        window.saveMatchAdmin = async () => {
            if (!isAdmin) return;
            const updated = {
                ...currentMatch,
                venue: document.getElementById("inpVenue").value.trim(),
                referee: document.getElementById("inpReferee").value.trim(),
                matchDate: document.getElementById("inpDate").value,
                matchClock: document.getElementById("inpTime").value,
                hasActiveMatch: document.getElementById("inpActive").checked,
                updatedAt: Date.now()
            };
            await setDoc(matchDocRef, updated);
        };

        renderMatchUI();
        lucide.createIcons();
    </script>
</body>
</html>
